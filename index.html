<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAPPY BIRTHDAY GAB!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas class="dark" id="dark"></canvas>
  <div class="balloons" id="balloons"></div>
  <canvas class="sparkles" id="sparkles"></canvas>
  <canvas class="fx" id="fx"></canvas>

  <main class="stage">
    <div class="scene" id="scene">

      <div class="greeting">Happy Birthday <span class="name">Gab</span>!</div>

      <div class="plate"></div>
      <div class="cake-shadow"></div>

      <div class="cake">
        <!-- sponge body -->
        <div class="body">
          <div class="glaze"></div>
          <div class="drips">
            <i style="left:14px;  --w:18px; --h:54px"></i>
            <i style="left:42px;  --w:14px; --h:84px"></i>
            <i style="left:72px;  --w:20px; --h:50px"></i>
            <i style="left:108px; --w:16px; --h:76px"></i>
            <i style="left:128px; --w:20px; --h:150px"></i>
            <i style="left:168px; --w:16px; --h:62px"></i>
            <i style="left:196px; --w:22px; --h:92px"></i>
            <i style="left:234px; --w:16px; --h:56px"></i>
            <i style="left:256px; --w:18px; --h:74px"></i>
          </div>
        </div>

        <!-- chocolate top -->
        <div class="top"></div>

        <!-- candles (click to blow) -->
        <div class="candles">
          <div class="candle num" style="left:22px; top:-44px" tabindex="0" role="button" aria-label="Blow out candles">
            <span class="flame"></span>
            <svg viewBox="0 0 44 64" aria-hidden="true">
              <defs><pattern id="stripeA" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#fff"/><rect width="7" height="14" fill="#ff8fa3"/></pattern></defs>
              <path d="M9 17 C9 4 35 4 35 19 C35 31 9 42 9 56 L37 56" fill="none" stroke="url(#stripeA)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="candle num" style="left:74px; top:-44px" tabindex="0" role="button" aria-label="Blow out candles">
            <span class="flame"></span>
            <svg viewBox="0 0 44 64" aria-hidden="true">
              <defs><pattern id="stripeB" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#fff"/><rect width="7" height="14" fill="#ff8fa3"/></pattern></defs>
              <path d="M9 10 H33 L20 30 C42 28 42 60 20 60 C13 60 8 57 7 52" fill="none" stroke="url(#stripeB)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- berries -->
        <div class="berries">
          <span class="sb" style="left:56px; top:2px;  width:44px; height:46px"></span>
          <span class="sb" style="left:22px; top:26px; width:50px; height:58px"></span>
          <span class="bb" style="left:64px;  top:60px; width:30px; height:30px"></span>
          <span class="bb" style="left:90px;  top:52px; width:32px; height:32px"></span>
          <span class="bb" style="left:84px;  top:74px; width:26px; height:26px"></span>
          <span class="bb" style="left:110px; top:70px; width:24px; height:24px"></span>
          </div>
      </div>

      <div class="puddle"></div>
      <div class="half"><i></i><i></i><i></i></div>
    </div>

    <div class="controls">
      <button class="mic" id="mic" type="button">Click this first before you blow</button>
    </div>
  </main>

  <button class="photo-add" id="photoBtn" type="button" title="Add more photos for the balloons">+ photos</button>
  <input type="file" id="photos" accept="image/*" multiple hidden>

  <script src="script.js"></script>
</body>
</html>
